<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Background Engine</title>
    <!-- 📡 REDIRECT ENGINE: Routes search bots securely back to your main index profile root -->
    <link rel="canonical" href="https://github.io">
    <meta name="robots" content="noindex, follow">
    <style>
        /* 🌌 GLOBAL BACKGROUND INJECTION: Locks your background asset across your entire body element */
        html, body, .main-page-wrapper-axis {
            background-image: url('./background.png') !important;
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important; /* Keeps the cartoon/3D background locked while text scrolls */
            min-height: 100vh !important;
            width: 100% !important;
        }
    </style>
    <script>
        // Safeguard: Instantly redirects accidental directory clicks back to the central profile page
        window.location.href = '../index.html';
    </script>
</head>

</body>
</html>
